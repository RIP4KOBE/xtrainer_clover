device: &device 'cuda'
seed: &seed 0
bounds_min: &bounds_min [-0.3, -0.2, 0.0]
bounds_max: &bounds_max [0.2, -0.8, 0.6]

keypoint_proposer:
  num_candidates_per_mask: 5
  min_dist_bt_keypoints: 0.06
  max_mask_ratio: 0.5
  device: *device
  bounds_min: *bounds_min
  bounds_max: *bounds_max
  seed: *seed