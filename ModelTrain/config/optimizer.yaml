  max: 1.0              # Maximum gradient clipping value

# Manipulability-related configuration
task_dim: 3             # Task space dimension, typically 3 (for 3D space)
scaling: true           # Whether to apply scaling when computing the Jacobian
manipulability_weight: 1.0  # Weight for manipulability loss in the optimization process

