# Device configuration
device: "cuda"  # Device to use for computation, e.g., "cuda" for GPU or "cpu"

# Time horizon configuration
obs_horizon: 1         # Observation horizon: number of past time steps to consider
action_horizon: 8       # Action horizon: number of future time steps to predict or act upon

# Optimization-related configuration
scale: 1.0              # Gradient scaling factor
scale_type: "normal"    # Gradient scaling type: "normal" (scaled by variance) or "div_var"
clip_grad_by_value:     # Gradient clipping range to avoid exploding gradients
